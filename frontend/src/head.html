
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- THE BROWSER'S OWN CANVAS, BEFORE ANY STYLE IS PARSED. The critical
       <style> below sets `color-scheme` from the RESOLVED theme, but it
       cannot apply until it has been parsed, and the canvas the engine paints
       between "there is a document" and "there is a style" answers to this
       meta instead. Without it a load on a dark device starts on the browser's
       default WHITE canvas (and, in a webview, the native window behind it),
       then flips to the dark ground once the style lands. That is the white
       frame #6130 reports on every page load.

       The bare two-value form delegates to the OS on purpose, for these first
       bytes only. The class-keyed `color-scheme` rules below override it the
       moment they apply, so a viewer who picked Light on a dark device still
       gets light scrollbars and controls on the #f4f2e4 page. Do not fold
       them into one: a meta cannot see the class, and the rules must stay
       class-keyed (tests/native-appearance.test.js pins that). -->
  <meta name="color-scheme" content="light dark">
  <!-- THE PAGE OWNS THE STATUS-BAR STRIP, on an installed iOS web app (#1929).

       Without this, a home-screen install gets iOS's OPAQUE status bar: the
       system draws that strip itself, tints it from `theme-color`, and starts
       the web view BELOW it. Two consequences, and the second is the bug:

       - `env(safe-area-inset-top)` is 0, because the page never reaches the
         unsafe area. Every reservation built for it — `--platform-safe-top`
         below, the kit's `.un-safe-top-extend` on the header — quietly
         resolves to nothing on the one platform they were written for.
       - No page pixel can reach that strip, so a dialog's scrim cannot dim
         it. Measured on an iPhone 17 Pro: opening a dialog drops the page
         from luminance 241 to 145 while the strip holds 241, a 115-unit
         cliff at exactly 62pt — the inset — that never moves in any frame of
         the fade. That is what "the system header and the background fade at
         different rates" is: the strip is not fading at all.

       `black-translucent` hands those pixels to the page. `env(...)` then
       reports the real 62px, the reservations that already exist start doing
       their job, and the existing `inset: 0` scrim covers the strip for free
       — one surface, one fade, nothing left to keep in step. Verified on a
       real standalone install before writing this: same two rows read 130.8
       and 130.8 with the scrim up, no edge anywhere in the top 400px.

       iOS composites the clock, wifi and battery ON TOP of whatever the page
       paints, so they survive the dim — measured at 24.4:1 against a dimmed
       ground, where WCAG asks 4.5:1. The Dynamic Island is a hardware cutout
       and stays black regardless.

       `theme-color` above still matters and is NOT redundant: it paints
       Android's address bar and the window ground a standalone install shows
       before the document does. It simply stops owning the iOS strip. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- THE PLATFORM'S NAME, not "dApps". This is the title the SERVICE WORKER
       serves: public/index.html is precached, so a cached load shows it in the
       tab, the task switcher and the native AppBar until the SPA routes and
       calls App.setHeaderTitle('Homeroom'). "dApps" is the name this
       shell had before the platform had one, and every other surface —
       manifest.webmanifest, the header on home, the landing page — says
       Homeroom. A cached document that names the product something
       nothing else calls it is the discontinuity, not just the delay. Renaming
       this title REQUIRES a SW_VERSION bump in public/sw.js, or existing
       installs keep serving the precached document with the old name. -->
  <title>Homeroom</title>
  <!-- The browser-chrome colour, and the ground the shell paints on before
       any stylesheet has loaded. Both live UP HERE, ahead of the theme
       module, because that module rewrites the metas from the resolved theme
       and the critical style has to beat the compiled Tailwind sheet (the LAST
       stylesheet in this head, by a contract documented on its own link).

       A MEDIA-KEYED PAIR, and only a STARTING POINT. The browser uses the one
       whose `prefers-color-scheme` side matches the DEVICE, so a dark-OS load
       gets a dark address bar and a dark window ground from the very first
       byte, before the theme module parses. Theme.apply() below then
       overwrites BOTH metas with the resolved ground in the same
       head-blocking pass that adds `.dark`, so the viewer's own Light/Dark
       choice wins and an explicit Light pick on a dark OS leaves no stale
       dark value in either. -->
  <meta name="theme-color" content="#f4f2e4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0d1b" media="(prefers-color-scheme: dark)">
  <style>
    /* WHY THIS IS INLINE AND NOT IN app.css. The page ground is a Tailwind
       utility on <body> (`bg-zinc-100 dark:bg-zinc-950`, see
       frontend/scripts/build-shell.mjs), and the stylesheet that defines it
       is the last resource in this head. Everything before it paints against
       the browser's default canvas — WHITE — so every load flashed white
       before settling on #eaeaea, and a dark-mode load flashed white before
       going near-black. The service worker makes that MORE visible rather
       than less: a shell served from cache paints immediately, so the gap
       between "there is a document" and "there is a stylesheet" is where the
       whole first impression happens.
       Set on <html> so it also fills the rubber-band area and any strip the
       body's own box does not cover. Duplicating the two values is the point:
       this rule has to be true with no stylesheet at all.

       `color-scheme` rides along because a background alone does not settle
       what the USER AGENT paints. It is what tells the engine which of its
       own two palettes to use, and it reaches three surfaces no declaration
       of ours can: the canvas underneath the document (the strip a WebView
       shows between navigation start and the first painted frame — the white
       flash the Homeroom Flutter shell shows on cold launch), the scrollbars,
       and the default rendering of form controls, which without it stay
       light-on-light inside a near-black shell.

       CLASS-KEYED, NOT `light dark`. The bare two-value form delegates the
       choice to the OS, and the shell's Light/Dark override is a class on
       <html> that no OS preference can see — so a viewer who picks Light on
       a dark phone would get dark scrollbars and dark <select> menus on a
       #eaeaea page. Keyed off `.dark` it tracks the resolved theme instead,
       and Theme.apply() below adds that class in the same head-blocking pass
       that fixes the background. */
    html { background-color: #f4f2e4; color-scheme: light; }
    html.dark { background-color: #0b0d1b; color-scheme: dark; }
    /* Held while this device's language loads (the script after the theme
       block). The ground above still paints, so the wait reads as the page
       loading, not as a blank screen. */
    html.language-pending body { visibility: hidden; }
    /* The first-session hold (the script after the theme block): the page
       ground above, and nothing else, until the shell draws its first
       signed-in screen. Inline for the same reason as the ground. */
    html.first-session-boot body { visibility: hidden; }
    /* The spinner of "Signing you in…" (features/auth/landing.tsx SigningIn)
       on that ground, for a link spent as the page opens (the hold script).
       Where SigningIn draws its own: a centred column of the 32px logotype,
       32px, the 24px spinner, 12px and a 20px line, so its top is 4px under
       the middle. On <html>, which the hold does not hide. */
    html.release-signing-in::after {
      content: ''; position: fixed; z-index: 2147483647; box-sizing: border-box;
      left: calc(50% - 12px); top: calc(50% + 4px); width: 24px; height: 24px;
      border-radius: 50%; border: 2.5px solid rgba(113, 113, 122, 0.25); border-top-color: #71717a;
      animation: release-signing-in-spin 0.8s linear infinite;
    }
    html.dark.release-signing-in::after { border-color: rgba(161, 161, 170, 0.25); border-top-color: #a1a1aa; }
    @keyframes release-signing-in-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { html.release-signing-in::after { animation: none; } }
    /* The wordmark on the held ground (review of #5323's build). While the
       holds above keep the body hidden, only the ground paints — a flat
       background with nothing on it, which is what a signed-out load shows
       for its first moments. The Homeroom wordmark, centred on that ground,
       says what is loading. Drawn on <html> like the spinner above, so it
       needs no markup and no stylesheet of ours, and only while a hold is
       held: it goes the moment the shell's first screen draws. Its bottom
       edge sits 8px above the middle, 12px over the spinner's top, the
       landing's own SigningIn column (its 32px logotype, 12px, the spinner).
       The ink is the landing's wordmark ink: near-black, white in dark
       mode — never the header's --brand-ink.

       It is the REAL logotype, not the word typed in a system italic font
       (review of this build: a plain italic "Homeroom" in a system font read
       as a flash of unstyled text next to the drawn mark a moment later).
       The drawing is `homeroom-logotype-black.png` used as a MASK over a
       solid ink colour, which is what lets one black raster take the white
       ink in dark mode; the file already ships (the mail frame draws it) and
       is precached like the header mark. 140 × 37 is the size the mail
       draws it at, the file being 2×. */
    html.first-session-boot::before,
    html.language-pending::before {
      content: ''; position: fixed; z-index: 2147483647;
      left: calc(50% - 70px); bottom: calc(50% + 8px); width: 140px; height: 37px;
      background-color: #09090b; pointer-events: none;
      -webkit-mask: url('/brand/homeroom-logotype-black.png') center / contain no-repeat;
      mask: url('/brand/homeroom-logotype-black.png') center / contain no-repeat;
    }
    html.dark.first-session-boot::before,
    html.dark.language-pending::before { background-color: #ffffff; }
  </style>
  <script>
    // Theme module — Light / Dark / System mode selector.
    // Storage contract:
    //   'light'  → light mode
    //   'dark'   → dark mode
    //   key absent → system (follows OS preference)
    // System removes the key; Light and Dark store the value explicitly.
    //
    // INLINE AND HEAD-BLOCKING ON PURPOSE (#1079 chunk B). This was
    // public/js/theme.js — an external tag here, preceded by a duplicate
    // three-line "no-flash guard" that re-implemented get()+apply() so the
    // stored mode landed on <html> before first paint. Both are this one
    // block now: the module ends by calling apply(), so it IS the no-flash
    // guard, and there is no longer a second copy of the storage contract to
    // drift from the first.
    //
    // It could not move into the React bundle with the rest of chunk B's
    // modules. That bundle is a deferred module: it runs after the document
    // is parsed, which is several frames too late to decide whether the page
    // is dark — the user would watch a light shell repaint dark on every
    // load. `window.Theme` also has to exist before app.js's init reads
    // Theme.get(), and the drawer's theme segments in
    // features/header/header-menu.tsx call Theme.set().
    window.Theme = (function () {
      const KEY = 'theme';
      const _listeners = [];

      // Screenshot-state deep link `?shot=dark` / `?shot=light`: pins the
      // mode for THIS LOAD only, nothing stored. The capture runner and the
      // dapp.json checks reach the page by URL with a fresh profile and no
      // way to press the drawer's theme segment, so without this every
      // screenshot of a dark-mode change shows the light shell. Read here
      // rather than in apply() so the drawer's segments agree with the page.
      // `?theme=dark` / `?theme=light` pins the same way, for a route whose
      // `shot` names another state (#1945's `?shot=app-tone-light&theme=dark`
      // is a light app under the DARK shell: the state is the pair).
      let shot = null;
      let themeParam = null;
      try {
        const params = new URLSearchParams(window.location.search);
        shot = params.get('shot');
        themeParam = params.get('theme');
      } catch {}
      const PINNED = (shot === 'dark' || shot === 'light') ? shot
        : (themeParam === 'dark' || themeParam === 'light') ? themeParam : null;

      function get() {
        if (PINNED) return PINNED;
        try {
          const val = window.localStorage.getItem(KEY);
          if (val === 'light' || val === 'dark') return val;
          return 'system';
        } catch {
          return 'system';
        }
      }

      // The two page grounds: THE WALLPAPER'S CREAM, and that cream
      // inverted — the homescreen design's page and its dark derivation,
      // which app.css paints (with its washes and star, re-tuned for dark)
      // on the launcher, the app view and their peer screens; messages and
      // the admin console keep the body's zinc-100 / zinc-950 on top of it.
      // The critical <style> above and the theme-color meta both need these
      // BEFORE any stylesheet has loaded, which is the whole point.
      // public/manifest.webmanifest carries the light one too, for the
      // standalone install's splash.
      const GROUND = { light: '#f4f2e4', dark: '#0b0d1b' };

      function apply() {
        const mode = get();
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const wantDark = mode === 'dark' || (mode === 'system' && prefersDark);
        if (wantDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        // THE BROWSER CHROME IS PART OF THE PAGE'S BACKGROUND, and it was
        // pinned to the dark ground for everybody. `theme-color` paints the
        // address bar on Android, the status-bar strip and the rubber-band
        // area on iOS, and the window ground a standalone install shows
        // before the document paints — so a light-mode viewer got a black
        // band above a #eaeaea page on every load and every overscroll.
        // Written from the RESOLVED theme, to EVERY meta: the media-keyed
        // pair above only covers the bytes before this script runs, and from
        // here on both carry the resolved ground so whichever one the device
        // matches shows the viewer's choice. The shell's own Light/Dark
        // override is a class on <html> that no media query can see, so a
        // viewer who picks Light on a dark OS must not be left with the dark
        // half of the pair. This runs before first paint on load and again on
        // every set() / OS change, so the chrome tracks the page it frames.
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
          m.setAttribute('content', wantDark ? GROUND.dark : GROUND.light);
        });
      }

      function set(mode) {
        try {
          if (mode === 'light' || mode === 'dark') {
            window.localStorage.setItem(KEY, mode);
          } else {
            window.localStorage.removeItem(KEY);
          }
        } catch {}
        apply();
        _listeners.forEach(function (fn) { try { fn(mode); } catch {} });
      }

      function onChange(fn) {
        _listeners.push(fn);
      }

      // Re-apply when OS preference changes (only meaningful in system mode).
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
        if (get() === 'system') {
          apply();
          _listeners.forEach(function (fn) { try { fn('system'); } catch {} });
        }
      });

      // Sync across tabs when another tab writes localStorage.theme.
      window.addEventListener('storage', function (e) {
        if (e.key === KEY) {
          apply();
          _listeners.forEach(function (fn) { try { fn(get()); } catch {} });
        }
      });

      // Apply before first paint. This is the no-flash guard.
      apply();

      return { get, set, apply, onChange };
    }());
  </script>
  <script>
    // Display module — text size and high contrast (#3969).
    // Storage contract (the same head-blocking pattern as window.Theme
    // above: a deferred React bundle is several frames too late to size the
    // page, so the stored choice lands on <html> before first paint):
    //   'homeroom:text-size'  → 'large' | 'larger'
    //                         → key removed for Normal (the default)
    //   'homeroom:contrast'   → 'more'
    //                         → key removed for off (the default)
    // Every storage access sits in try/catch: unreadable storage means the
    // defaults, and an unknown stored value reads as a default too.
    window.Display = (function () {
      const SIZE_KEY = 'homeroom:text-size';
      const CONTRAST_KEY = 'homeroom:contrast';
      const _listeners = [];

      function getTextSize() {
        try {
          const val = window.localStorage.getItem(SIZE_KEY);
          if (val === 'large' || val === 'larger') return val;
          return 'normal';
        } catch {
          return 'normal';
        }
      }

      function getContrast() {
        try {
          return window.localStorage.getItem(CONTRAST_KEY) === 'more';
        } catch {
          return false;
        }
      }

      // Sets or removes data-text-size / data-contrast on <html>. The
      // attributes live OUTSIDE React's body tree, exactly like `.dark`, so
      // hydrating the shell never disagrees with them.
      function apply() {
        const root = document.documentElement;
        const size = getTextSize();
        if (size === 'normal') {
          root.removeAttribute('data-text-size');
        } else {
          root.setAttribute('data-text-size', size);
        }
        if (getContrast()) {
          root.setAttribute('data-contrast', 'more');
        } else {
          root.removeAttribute('data-contrast');
        }
      }

      function setTextSize(size) {
        try {
          if (size === 'large' || size === 'larger') {
            window.localStorage.setItem(SIZE_KEY, size);
          } else {
            window.localStorage.removeItem(SIZE_KEY);
          }
        } catch { /* unwritable storage: the choice applies for this load only */ }
        apply();
        _listeners.forEach(function (fn) { try { fn(); } catch {} });
      }

      function setContrast(on) {
        try {
          if (on) {
            window.localStorage.setItem(CONTRAST_KEY, 'more');
          } else {
            window.localStorage.removeItem(CONTRAST_KEY);
          }
        } catch { /* unwritable storage: the choice applies for this load only */ }
        apply();
        _listeners.forEach(function (fn) { try { fn(); } catch {} });
      }

      function onChange(fn) {
        _listeners.push(fn);
      }

      // Other tabs in the same browser follow (the settings pane re-reads
      // through the same listener).
      window.addEventListener('storage', function (e) {
        if (e.key === SIZE_KEY || e.key === CONTRAST_KEY) {
          apply();
          _listeners.forEach(function (fn) { try { fn(); } catch {} });
        }
      });

      // Apply before first paint. This is the no-flash guard: the stored
      // size is on <html> before app.css, whose rules read it, is applied.
      apply();

      return { getTextSize, setTextSize, getContrast, setContrast, apply, onChange };
    }());
  </script>
  <script>
    // Skin module — the looks, two experiments (Settings › Experimental,
    // both off by default). The same head-blocking pattern as window.Display:
    // the stored choice lands on <html> before app.css, whose rules read
    // it, is applied, so a look never flashes in after first paint.
    //   'homeroom:skin'  → 'brand'  the new look (light mode only)
    //                    → 'glass'  the glass look (light and dark)
    //                    → key removed for the standard look (the default)
    // Kept on the DEVICE: there is nothing to save or fail. app.css scopes
    // every rule of a look to html[data-skin="<look>"]. Every storage access
    // sits in try/catch: unreadable storage means the standard look.
    // `?skin=brand|glass|standard` pins a look for THIS LOAD only, nothing
    // stored: the capture runner reaches the page by URL with a fresh
    // profile, the same way `?theme=` pins the mode above.
    window.Skin = (function () {
      const SKIN_KEY = 'homeroom:skin';
      const SKINS = ['brand', 'glass'];
      const _listeners = [];

      let pinned = null;
      try {
        const want = new URLSearchParams(window.location.search).get('skin');
        if (want === 'standard' || SKINS.includes(want)) pinned = want;
      } catch {}

      function get() {
        if (pinned) return pinned;
        try {
          const val = window.localStorage.getItem(SKIN_KEY);
          return SKINS.includes(val) ? val : 'standard';
        } catch {
          return 'standard';
        }
      }

      // Sets or removes data-skin on <html>. Like data-text-size, the
      // attribute lives OUTSIDE React's body tree, so hydrating the shell
      // never disagrees with it.
      function apply() {
        const root = document.documentElement;
        const skin = get();
        if (skin !== 'standard') {
          root.setAttribute('data-skin', skin);
        } else {
          root.removeAttribute('data-skin');
        }
      }

      function set(skin) {
        pinned = null;
        try {
          if (SKINS.includes(skin)) {
            window.localStorage.setItem(SKIN_KEY, skin);
          } else {
            window.localStorage.removeItem(SKIN_KEY);
          }
        } catch { /* unwritable storage: nothing is stored, so the look stays standard */ }
        apply();
        _listeners.forEach(function (fn) { try { fn(); } catch {} });
      }

      function onChange(fn) {
        _listeners.push(fn);
      }

      // Other tabs in the same browser follow (the settings pane re-reads
      // through the same listener).
      window.addEventListener('storage', function (e) {
        if (e.key === SKIN_KEY) {
          apply();
          _listeners.forEach(function (fn) { try { fn(); } catch {} });
        }
      });

      // Apply before first paint: the no-flash guard.
      apply();

      return { get, set, apply, onChange };
    }());
  </script>
  <script>
    // Language first paint (frontend/locales/README.md). The document is
    // prerendered in English, and another language is applied after
    // hydration, once its pack has loaded. When this device last showed
    // Homeroom in another language, hold the page until then rather than
    // flash the English: lib/i18n/core.ts writes the key on every switch and
    // lifts the hold the moment a language is on screen. The hold lifts
    // itself after three seconds whatever happens, so a slow or failed pack
    // costs a moment of English, never the page.
    (function () {
      try {
        // The languages written right to left, by primary subtag. A literal
        // copy of RTL_LANGUAGES in lib/i18n/direction.ts: this runs before
        // that module loads, and tests/language-direction.test.js pins the
        // two lists to each other. Arabic must not paint left to right.
        var RTL = ['ar', 'he', 'fa', 'ur', 'ps', 'dv', 'ckb', 'yi', 'sd', 'ug'];
        var shown = localStorage.getItem('homeroom:language:shown');
        if (!shown) return;
        var root = document.documentElement;
        var primary = String(shown).toLowerCase().split(/[-_]/)[0];
        root.lang = shown;
        root.dir = RTL.indexOf(primary) === -1 ? 'ltr' : 'rtl';
        if (shown === 'en') return;
        root.classList.add('language-pending');
        setTimeout(function () { root.classList.remove('language-pending'); }, 3000);
      } catch (e) { /* storage blocked: nothing remembered, nothing held */ }
    }());
  </script>
  <script>
    // No Home before a first screen that is not Home: the signed-out
    // landing, the "You're in" mail's link, and "What do you want to make?"
    // across a reload.
    //
    // The prerendered markup is Home, and it paints before any script has
    // run. Three documents are about to show something else, so they hold
    // the body hidden from before that first paint, and the page ground
    // shows:
    //
    //   - A browser with no saved session (App.SESSION_SNAPSHOT_KEY in
    //     public/js/app.js, written on sign-in and cleared on sign-out):
    //     nobody is signed in here, never or not since signing out, so the
    //     first screen is the landing. Evan, 10 Oct 2026: refreshing the
    //     signed-out welcome page showed Home's skeleton first. A browser
    //     that was signed in keeps the skeleton, since Home is what comes.
    //
    //   - A waitlist "You're in" link (`?signup=1` / `?login=1`, the shapes
    //     sendWaitlistReleaseMail writes). It opens signed out, on the
    //     landing with the sign-in sheet over it (AuthScreens.enter). Evan,
    //     10 Oct 2026: arriving from the phone app, Home showed first.
    //   - The story's sign-in sheet sets the first session's make flag
    //     (features/first-session, MAKE_FLAG) before it finishes a new
    //     account's sign-in, and that sign-in can reload the page onto the
    //     live build (App._moveToLiveShell, from AuthScreens.finishLogin).
    //   - A saved session that still owes "What do you want to make?" (a
    //     reload on it, or the tab reopened): the shell draws it from the
    //     snapshot as it starts (CommunitiesFirstRun._showFromSnapshot).
    //     Onboarding run three, 12 Oct 2026: a reload of that screen
    //     painted Home's skeleton for a frame before it.
    //
    // The shell lifts the hold once it has drawn its first screen:
    // App._liftFirstSessionBoot in public/js/app.js, called once enterAuthed
    // has drawn it, and when the shell boots signed out or into the waiting
    // room. The timer is the floor under all of that: whatever happens, the
    // page shows within 8 seconds.
    (function () {
      var hold = false;
      try { hold = sessionStorage.getItem('usernode:first-session:make') === '1'; } catch (_) {}
      try {
        if (!hold) {
          var saved = localStorage.getItem('usernode.session.v1');
          if (!saved) hold = true;
          else {
            // Still owes "What do you want to make?" (the join step's
            // firstSessionNow, features/auth/communities-first-run.js): the
            // reload draws it from this snapshot, so Home is not shown first.
            var owed = (JSON.parse(saved) || {}).user || {};
            hold = owed.needsCommunitiesChoice === true && owed.storyFirstSession === true
              && owed.needsUsernameChoice !== true && owed.hasPlatformAccess !== false;
          }
        }
      } catch (_) {}
      try {
        if (!hold && !location.hash) {
          var query = new URLSearchParams(location.search);
          hold = query.has('signup') || query.has('login');
        }
      } catch (_) {}
      if (!hold) return;

    //

    // corner of a top-frame page served from an app's own subdomain — a
    // shared link, where nothing else says the page is a Homeroom app. The
    // shell loads that same bridge, in the top frame, from the platform's
    // apex, and the two are indistinguishable by hostname shape alone:
    // `<slug>.<domain>` and the platform's own `<domain>` are both a label
    // in front of a registrable domain, and only the platform knows which
    // of the two it is serving. So the shell says so outright rather than
    // leaving the bridge to guess, and the guess it used to make instead
    // is why the mark never appeared on a shared link at all.

    // that read as a screen with no title, so the in-page one is drawn
    // there now too (see css/app.css). The class still gates the
    // safe-area and native-performance rules, so it is applied the same
    // way: on <html>, before app.js runs, so nothing flashes — the
    // bridge sets

    // the presence of the injected `Homeroom` JS channel.
    // `?un-native-webview=1` forces the same class from a plain URL. The
    // real signal is the injected JS channel, which a headless browser can
    // never have — so without this override the native-only presentation

    // unreachable by proposal checks and invisible to before/after
    // screenshots. Mirrors the kit's own `?un-platform=ios` skin override,
    // and is deliberately NOT staging-gated: a pure presentation flag with
    // no writes, so the "before" shot works the moment this ships.
